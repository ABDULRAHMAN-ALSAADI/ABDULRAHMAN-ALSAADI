<svg width="1200" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#10B981" stop-opacity="0"/>
      <stop offset=".18" stop-color="#10B981"/>
      <stop offset=".82" stop-color="#10B981"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes dash { to { stroke-dashoffset:-80 } }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      .flow { stroke-dasharray:7 9; animation:dash 4s linear infinite; }
      .pulse { animation:pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="168" rx="24" fill="#08130F" stroke="#18382D" stroke-width="2"/>
  <path d="M190 85H1010" stroke="url(#line)" stroke-width="2" class="flow"/>
  <path d="M1010 112C1010 139 900 147 600 147C300 147 190 139 190 112" stroke="#1E493A" stroke-width="2" stroke-dasharray="5 9" class="flow"/>

  <g class="mono" text-anchor="middle">
    <g transform="translate(190 85)">
      <circle r="34" fill="#0B1E18" stroke="#2E6A55" stroke-width="2"/>
      <circle r="6" fill="#34D399" filter="url(#glow)" class="pulse"/>
      <text y="-48" fill="#D1FAE5" font-size="15" letter-spacing="2">DESIGN</text>
      <text y="59" fill="#6E9E8C" font-size="11" letter-spacing="1.4">CONSTRAINTS</text>
    </g>
    <g transform="translate(462 85)">
      <circle r="34" fill="#0B1E18" stroke="#2E6A55" stroke-width="2"/>
      <circle r="6" fill="#34D399" filter="url(#glow)" class="pulse"/>
      <text y="-48" fill="#D1FAE5" font-size="15" letter-spacing="2">BUILD</text>
      <text y="59" fill="#6E9E8C" font-size="11" letter-spacing="1.4">HARDWARE</text>
    </g>
    <g transform="translate(738 85)">
      <circle r="34" fill="#0B1E18" stroke="#2E6A55" stroke-width="2"/>
      <circle r="6" fill="#34D399" filter="url(#glow)" class="pulse"/>
      <text y="-48" fill="#D1FAE5" font-size="15" letter-spacing="2">INTEGRATE</text>
      <text y="59" fill="#6E9E8C" font-size="11" letter-spacing="1.4">SYSTEMS</text>
    </g>
    <g transform="translate(1010 85)">
      <circle r="34" fill="#0B1E18" stroke="#2E6A55" stroke-width="2"/>
      <circle r="6" fill="#34D399" filter="url(#glow)" class="pulse"/>
      <text y="-48" fill="#D1FAE5" font-size="15" letter-spacing="2">VALIDATE</text>
      <text y="59" fill="#6E9E8C" font-size="11" letter-spacing="1.4">REALITY</text>
    </g>
  </g>
</svg>